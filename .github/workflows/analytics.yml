name: Verify analytics collection

on:
  pull_request:
    paths:
      - script.js
      - tests/test_analytics_engagement.js
      - .github/workflows/analytics.yml
  push:
    branches: [main]
    paths:
      - script.js
      - tests/test_analytics_engagement.js
      - .github/workflows/analytics.yml

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check script.js
      - run: node --test tests/test_analytics_engagement.js
